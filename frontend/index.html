<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>FunkWurm — G-code visualizer</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0a0a0f; color: #e0e0e0; font-family: system-ui, sans-serif; }
    header { padding: 12px 20px; background: #14141c; border-bottom: 1px solid #222; display: flex; align-items: center; gap: 16px; }
    header h1 { margin: 0; font-size: 16px; font-weight: 600; }
    #status { font-size: 12px; color: #888; }
    #canvas-wrap { width: 100%; height: calc(100vh - 210px); position: relative; }
    #canvas-wrap canvas { display: block; }
    #info { position: absolute; top: 10px; left: 10px; font-size: 11px; color: #aaa; background: rgba(0,0,0,0.5); padding: 6px 10px; border-radius: 4px; }
    #fps { position: absolute; top: 10px; right: 10px; font-size: 11px; color: #8c8; background: rgba(0,0,0,0.5); padding: 6px 10px; border-radius: 4px; font-variant-numeric: tabular-nums; }
    button:disabled { opacity: 0.5; cursor: not-allowed !important; }

    /* Settings panel — refreshed UI */
    :root {
      --bg-panel: #0f1015;
      --bg-section: #15161d;
      --bg-input: #1c1d26;
      --bg-input-hover: #242633;
      --border: #26272f;
      --border-strong: #2f313c;
      --text: #e6e8ef;
      --text-dim: #8b8e99;
      --text-fade: #5d606b;
      --accent: #5aa7ff;
      --accent-dim: #3a7bd5;
      --danger: #d04060;
      --radius: 6px;
    }

    #btn-settings {
      padding: 6px 12px; background: #1c1d26; color: var(--text); border: 1px solid var(--border);
      border-radius: var(--radius); cursor: pointer; font-size: 12px; font-weight: 500;
      transition: background 0.15s, border-color 0.15s;
    }
    #btn-settings:hover { background: var(--bg-input-hover); border-color: var(--accent-dim); }

    #settings-panel {
      position: fixed; top: 0; right: 0; width: 360px; height: 100vh;
      background: var(--bg-panel); border-left: 1px solid var(--border);
      transform: translateX(100%); transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 100; display: flex; flex-direction: column;
      box-shadow: -12px 0 40px rgba(0,0,0,0.5);
    }
    #settings-panel.open { transform: translateX(0); }
    #settings-panel > header {
      padding: 16px 20px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; background: var(--bg-section);
    }
    #settings-panel > header h2 {
      margin: 0; font-size: 13px; font-weight: 600; flex: 1;
      text-transform: uppercase; letter-spacing: 0.1em; color: var(--text);
    }
    #btn-close-settings {
      background: none; color: var(--text-dim); border: none; font-size: 22px; line-height: 1;
      cursor: pointer; padding: 0 4px; transition: color 0.15s;
    }
    #btn-close-settings:hover { color: var(--text); }

    #settings-panel .body { flex: 1; overflow-y: auto; padding: 12px 16px 20px; }
    #settings-panel .body::-webkit-scrollbar { width: 8px; }
    #settings-panel .body::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
    #settings-panel .body::-webkit-scrollbar-track { background: transparent; }

    #settings-panel details {
      background: var(--bg-section); border: 1px solid var(--border);
      border-radius: var(--radius); margin-bottom: 10px; overflow: hidden;
    }
    #settings-panel details[open] { border-color: var(--border-strong); }
    #settings-panel summary {
      list-style: none; cursor: pointer; padding: 10px 14px;
      font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.09em;
      color: var(--accent); user-select: none; position: relative;
      display: flex; align-items: center; gap: 8px;
    }
    #settings-panel summary::-webkit-details-marker { display: none; }
    #settings-panel summary::after {
      content: '▸'; margin-left: auto; color: var(--text-fade); font-size: 10px;
      transition: transform 0.15s;
    }
    #settings-panel details[open] summary::after { transform: rotate(90deg); }
    #settings-panel summary:hover { background: var(--bg-input); }
    #settings-panel .section-body { padding: 6px 14px 12px; }

    #settings-panel .row {
      display: flex; align-items: center; gap: 10px; padding: 6px 0;
      font-size: 12px; color: var(--text);
    }
    #settings-panel .row .label-group {
      flex: 1; display: flex; align-items: center; gap: 6px; min-width: 0;
    }
    #settings-panel .row label { color: var(--text); cursor: default; }

    /* Help tooltip */
    .help {
      display: inline-flex; align-items: center; justify-content: center;
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--bg-input); color: var(--text-dim);
      font-size: 9px; font-weight: 700; cursor: help;
      border: 1px solid var(--border-strong); flex-shrink: 0;
      position: relative;
    }
    .help:hover { color: var(--accent); border-color: var(--accent-dim); }
    .help::before {
      content: attr(data-tip);
      position: absolute; bottom: calc(100% + 8px); right: 0;
      background: #0a0b11; color: var(--text);
      border: 1px solid var(--border-strong); border-radius: var(--radius);
      padding: 8px 10px; font-size: 11px; font-weight: 400;
      line-height: 1.4; width: 240px;
      white-space: normal; text-align: left;
      opacity: 0; pointer-events: none; transform: translateY(4px);
      transition: opacity 0.15s, transform 0.15s;
      z-index: 200; text-transform: none; letter-spacing: 0;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .help:hover::before { opacity: 1; transform: translateY(0); }

    /* Custom range slider */
    #settings-panel input[type=range] {
      flex: 1.2; min-width: 0; appearance: none; background: transparent;
      height: 20px; cursor: pointer;
    }
    #settings-panel input[type=range]::-webkit-slider-runnable-track {
      height: 4px; background: var(--bg-input); border-radius: 2px;
    }
    #settings-panel input[type=range]::-moz-range-track {
      height: 4px; background: var(--bg-input); border-radius: 2px;
    }
    #settings-panel input[type=range]::-webkit-slider-thumb {
      appearance: none; width: 14px; height: 14px; border-radius: 50%;
      background: var(--accent); margin-top: -5px; cursor: grab;
      box-shadow: 0 0 0 2px var(--bg-panel);
      transition: transform 0.1s;
    }
    #settings-panel input[type=range]::-moz-range-thumb {
      width: 14px; height: 14px; border-radius: 50%; border: none;
      background: var(--accent); cursor: grab; box-shadow: 0 0 0 2px var(--bg-panel);
    }
    #settings-panel input[type=range]:hover::-webkit-slider-thumb { transform: scale(1.15); }
    #settings-panel input[type=range]:active::-webkit-slider-thumb { cursor: grabbing; }

    /* Custom checkbox */
    #settings-panel input[type=checkbox] {
      appearance: none; width: 32px; height: 18px; border-radius: 9px;
      background: var(--bg-input); border: 1px solid var(--border-strong);
      position: relative; cursor: pointer; transition: background 0.15s;
      flex-shrink: 0;
    }
    #settings-panel input[type=checkbox]::after {
      content: ''; position: absolute; top: 1px; left: 1px;
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--text-dim); transition: transform 0.15s, background 0.15s;
    }
    #settings-panel input[type=checkbox]:checked { background: var(--accent-dim); border-color: var(--accent); }
    #settings-panel input[type=checkbox]:checked::after { transform: translateX(14px); background: #fff; }

    /* Select + number */
    #settings-panel select, #settings-panel input[type=number] {
      background: var(--bg-input); color: var(--text);
      border: 1px solid var(--border-strong); border-radius: var(--radius);
      padding: 4px 8px; font-size: 12px; font-family: inherit;
    }
    #settings-panel select:hover, #settings-panel input[type=number]:hover { border-color: var(--accent-dim); }
    #settings-panel select:focus, #settings-panel input[type=number]:focus {
      outline: none; border-color: var(--accent);
    }
    #settings-panel input[type=number] { width: 70px; }

    /* Color input */
    #settings-panel input[type=color] {
      width: 32px; height: 24px; border: 1px solid var(--border-strong);
      border-radius: var(--radius); background: transparent; cursor: pointer; padding: 0;
    }
    #settings-panel input[type=color]::-webkit-color-swatch { border: none; border-radius: 4px; }
    #settings-panel input[type=color]::-moz-color-swatch { border: none; border-radius: 4px; }

    #settings-panel .row .val {
      min-width: 42px; text-align: right; font-variant-numeric: tabular-nums;
      color: var(--text-dim); font-size: 11px; font-weight: 500;
      background: var(--bg-input); padding: 2px 6px; border-radius: 4px;
    }

    #settings-panel button.panel-btn {
      width: 100%; padding: 9px; margin-top: 10px;
      background: var(--accent-dim); color: #fff;
      border: none; border-radius: var(--radius); cursor: pointer; font-size: 12px;
      font-weight: 500; transition: background 0.15s;
    }
    #settings-panel button.panel-btn:hover { background: var(--accent); }
    #settings-panel button.danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
    #settings-panel button.danger:hover { background: var(--danger); color: #fff; }
  </style>
</head>
<body>
  <header>
    <h1>FunkWurm</h1>
    <span id="status">verbinden…</span>
    <div style="flex: 1;"></div>
    <button id="btn-settings">⚙ Settings</button>
    <button id="btn-reload" style="padding: 6px 12px; background: #2a3c56; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;">Herladen</button>
  </header>

  <aside id="settings-panel" aria-label="Settings">
    <header>
      <h2>Settings</h2>
      <button id="btn-close-settings" aria-label="Close">×</button>
    </header>
    <div class="body">

      <details open>
        <summary>Rendering</summary>
        <div class="section-body">
          <div class="row">
            <span class="label-group"><label>Quality</label>
              <span class="help" data-tip="Low = dunne lijnen, sneldraaierig. Medium = dikke lijnen met vaste px-dikte. High = echte 3D extrusie-volumes per segment (mooiste, maar het zwaarst)."></span>
            </span>
            <select data-setting="quality">
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
            </select>
          </div>
          <div class="row">
            <span class="label-group"><label>Antialiasing</label>
              <span class="help" data-tip="Smoothe randen van lijnen en volumes. Geeft fors FPS-verlies op integrated GPUs. Uit = sneller, karteliger."></span>
            </span>
            <input type="checkbox" data-setting="antialias">
          </div>
          <div class="row">
            <span class="label-group"><label>Pixel ratio</label>
              <span class="help" data-tip="Aantal gerenderde pixels per CSS-pixel. 0.5 = wazig maar ~4× sneller. 1 = scherp. 2 = retina-quality maar duur."></span>
            </span>
            <input type="range" min="0.5" max="2" step="0.25" data-setting="pixelRatio"><span class="val"></span>
          </div>
          <div class="row">
            <span class="label-group"><label>Frustum culling</label>
              <span class="help" data-tip="Objecten buiten het camerabeeld worden overgeslagen. Aanbevolen aan; helpt als je inzoomt op een detail."></span>
            </span>
            <input type="checkbox" data-setting="frustumCulling">
          </div>
        </div>
      </details>

      <details open>
        <summary>Camera</summary>
        <div class="section-body">
          <div class="row">
            <span class="label-group"><label>Field of view</label>
              <span class="help" data-tip="Kijkhoek in graden. Lager (~35°) = telefoto-vlak, minder perspectiefvertekening. Hoger (~80°) = fisheye, meer in beeld."></span>
            </span>
            <input type="range" min="20" max="90" step="1" data-setting="fov"><span class="val"></span>
          </div>
          <div class="row">
            <span class="label-group"><label>Pan X</label>
              <span class="help" data-tip="Horizontale offset van de camera bij reframe, als fractie van objectbreedte. Positief = camera schuift naar rechts, object komt links in beeld."></span>
            </span>
            <input type="range" min="-0.5" max="0.5" step="0.05" data-setting="panX"><span class="val"></span>
          </div>
          <div class="row">
            <span class="label-group"><label>Pan Z</label>
              <span class="help" data-tip="Verticale offset. Positief = camera omhoog, object zakt in beeld."></span>
            </span>
            <input type="range" min="-0.5" max="0.5" step="0.05" data-setting="panZ"><span class="val"></span>
          </div>
          <div class="row">
            <span class="label-group"><label>Damping</label>
              <span class="help" data-tip="Camera blijft nog even doordraaien na loslaten muis. Aan = glad/cinematic. Uit = snappy/direct."></span>
            </span>
            <input type="checkbox" data-setting="enableDamping">
          </div>
          <button class="panel-btn" id="btn-reframe">Reframe op bestand</button>
        </div>
      </details>

      <details>
        <summary>Lines (Medium quality)</summary>
        <div class="section-body">
          <div class="row">
            <span class="label-group"><label>Linewidth</label>
              <span class="help" data-tip="Dikte van de extrusie-lijnen in pixels. Alleen actief wanneer 'World units' uit staat."></span>
            </span>
            <input type="range" min="1" max="15" step="1" data-setting="mediumLinewidth"><span class="val"></span>
          </div>
          <div class="row">
            <span class="label-group"><label>World units</label>
              <span class="help" data-tip="Gebruik 'Extrusion width' (mm) i.p.v. pixels voor lijndikte. Lijnen schalen met zoom. Duurder bij dik inzoomen."></span>
            </span>
            <input type="checkbox" data-setting="mediumWorldUnits">
          </div>
        </div>
      </details>

      <details>
        <summary>Volumes (High quality)</summary>
        <div class="section-body">
          <div class="row">
            <span class="label-group"><label>Extrusion width (mm)</label>
              <span class="help" data-tip="Breedte van het box-volume per gcode-segment. Typisch 0.4mm (nozzle). Lager = slanker. Alleen actief in High mode."></span>
            </span>
            <input type="range" min="0.1" max="2" step="0.05" data-setting="extrusionWidth"><span class="val"></span>
          </div>
          <div class="row">
            <span class="label-group"><label>Layer height (mm)</label>
              <span class="help" data-tip="Hoogte van het box-volume per segment. Match met je echte laaghoogte (bijv. 0.2mm) voor realistische preview."></span>
            </span>
            <input type="range" min="0.05" max="1" step="0.01" data-setting="layerHeight"><span class="val"></span>
          </div>
        </div>
      </details>

      <details>
        <summary>Scene</summary>
        <div class="section-body">
          <div class="row">
            <span class="label-group"><label>Grid</label>
              <span class="help" data-tip="Rasterlijnen op bed-hoogte (Z=0). Helpt bij dieptegevoel."></span>
            </span>
            <input type="checkbox" data-setting="showGrid">
          </div>
          <div class="row">
            <span class="label-group"><label>Axes</label>
              <span class="help" data-tip="X (rood), Y (groen), Z (blauw) assen bij origin."></span>
            </span>
            <input type="checkbox" data-setting="showAxes">
          </div>
          <div class="row">
            <span class="label-group"><label>Build plate</label>
              <span class="help" data-tip="Semi-transparant vlak als printerbed onder het object."></span>
            </span>
            <input type="checkbox" data-setting="showBuildPlate">
          </div>
          <div class="row">
            <span class="label-group"><label>Bed X (mm)</label>
              <span class="help" data-tip="Breedte van het printerbed. Bepaalt grid en buildplate."></span>
            </span>
            <input type="number" data-setting="bedSizeX" min="50" max="500" step="10">
          </div>
          <div class="row">
            <span class="label-group"><label>Bed Y (mm)</label>
              <span class="help" data-tip="Diepte van het printerbed."></span>
            </span>
            <input type="number" data-setting="bedSizeY" min="50" max="500" step="10">
          </div>
          <div class="row">
            <span class="label-group"><label>Background</label>
              <span class="help" data-tip="Achtergrondkleur van de 3D scene."></span>
            </span>
            <input type="color" data-setting="bgColor">
          </div>
        </div>
      </details>

      <details>
        <summary>Lighting</summary>
        <div class="section-body">
          <div class="row">
            <span class="label-group"><label>Hemisphere</label>
              <span class="help" data-tip="Omnidirectioneel hemelpracht (hemel-naar-grond gradient). Basis ambient."></span>
            </span>
            <input type="range" min="0" max="2" step="0.1" data-setting="ambientIntensity"><span class="val"></span>
          </div>
          <div class="row">
            <span class="label-group"><label>Directional</label>
              <span class="help" data-tip="Hoofdlicht van boven-rechts — simuleert zonlicht, geeft de 3D vormen hun schaduw-kant."></span>
            </span>
            <input type="range" min="0" max="2" step="0.1" data-setting="dirIntensity"><span class="val"></span>
          </div>
          <div class="row">
            <span class="label-group"><label>Fill</label>
              <span class="help" data-tip="Zachter invullicht van links-onder tegen te donkere schaduwen."></span>
            </span>
            <input type="range" min="0" max="1" step="0.05" data-setting="fillIntensity"><span class="val"></span>
          </div>
        </div>
      </details>

      <details>
        <summary>Colors</summary>
        <div class="section-body">
          <div class="row">
            <span class="label-group"><label>Scheme</label>
              <span class="help" data-tip="Layer height = blauw-naar-rood gradient per Z. Solid = één kleur voor alles."></span>
            </span>
            <select data-setting="colorScheme">
              <option value="layer">Layer height</option>
              <option value="solid">Solid</option>
            </select>
          </div>
          <div class="row">
            <span class="label-group"><label>Solid color</label>
              <span class="help" data-tip="Gebruikte kleur wanneer Scheme op Solid staat."></span>
            </span>
            <input type="color" data-setting="solidColor">
          </div>
        </div>
      </details>

      <button class="panel-btn danger" id="btn-reset-settings">Reset naar defaults</button>
    </div>
  </aside>

  <div id="upload-zone" style="padding: 16px 20px; background: #14141c; border-bottom: 1px solid #222;">
    <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
      <label style="cursor: pointer; padding: 8px 16px; background: #2a3c56; color: #fff; border-radius: 4px; font-size: 13px;">
        📁 Kies bestand
        <input type="file" id="file-input" accept=".gcode,.gco,.g,.stl" style="display: none;">
      </label>
      <span id="file-name" style="font-size: 12px; color: #888;">geen bestand geselecteerd</span>
      <div style="flex: 1;"></div>
      <label style="font-size: 12px; color: #aaa; display: flex; align-items: center; gap: 6px;">
        <input type="checkbox" id="auto-print"> direct printen na upload (PAS OP: geen check!)
      </label>
      <button id="btn-upload" disabled style="padding: 8px 16px; background: #4a9eff; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 13px;">Upload</button>
    </div>
    <div id="print-controls" style="margin-top: 12px; display: none; gap: 8px;">
      <button id="btn-start" style="padding: 6px 14px; background: #22aa55; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;">▶ Start print</button>
      <button id="btn-pause" style="padding: 6px 14px; background: #e0a030; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;">⏸ Pause/Resume</button>
      <button id="btn-cancel" style="padding: 6px 14px; background: #d04040; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;">⏹ Cancel</button>
    </div>
    <div id="upload-msg" style="margin-top: 8px; font-size: 12px; min-height: 16px;"></div>
  </div>

  <div id="canvas-wrap">
    <div id="info">geen bestand geladen</div>
    <div id="fps">– fps</div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { STLLoader } from 'three/addons/loaders/STLLoader.js';
    import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';
    import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
    import { LineMaterial } from 'three/addons/lines/LineMaterial.js';

    const SETTINGS_KEY = 'funkwurm.settings';
    const DEFAULT_SETTINGS = {
      // Rendering
      quality: 'high',
      antialias: false,
      pixelRatio: 0.5,
      frustumCulling: true,
      // Camera
      fov: 69,
      enableDamping: false,
      panX: 0.3,
      panZ: 0.05,
      // Lines (medium)
      mediumLinewidth: 1,
      mediumWorldUnits: false,
      // Volumes (high)
      extrusionWidth: 0.1,
      layerHeight: 0.18,
      // Scene
      showGrid: true,
      showAxes: true,
      showBuildPlate: false,
      bedSizeX: 220,
      bedSizeY: 220,
      bgColor: '#0a0a0f',
      // Lighting
      ambientIntensity: 1.1,
      dirIntensity: 1.2,
      fillIntensity: 0.6,
      // Colors
      colorScheme: 'layer',
      solidColor: '#4a9eff',
    };

    function loadSettings() {
      try {
        const raw = localStorage.getItem(SETTINGS_KEY);
        return { ...DEFAULT_SETTINGS, ...(raw ? JSON.parse(raw) : {}) };
      } catch {
        return { ...DEFAULT_SETTINGS };
      }
    }
    function saveSettings() {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
    }
    const settings = loadSettings();

    const $ = id => document.getElementById(id);

    // --- Three.js setup ---
    const wrap = $('canvas-wrap');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(settings.bgColor);

    const camera = new THREE.PerspectiveCamera(settings.fov, wrap.clientWidth / wrap.clientHeight, 0.1, 5000);
    camera.position.set(200, 200, 200);
    camera.up.set(0, 0, 1);

    let renderer = null;
    let controls = null;
    let needsRender = true;
    const requestRender = () => { needsRender = true; };

    function createRenderer() {
      const old = renderer;
      renderer = new THREE.WebGLRenderer({ antialias: settings.antialias, powerPreference: 'high-performance' });
      renderer.setPixelRatio(settings.pixelRatio);
      renderer.setSize(wrap.clientWidth, wrap.clientHeight);
      if (old) {
        wrap.removeChild(old.domElement);
        old.dispose();
      }
      wrap.appendChild(renderer.domElement);
      // OrbitControls moet opnieuw bind op nieuwe DOM canvas
      if (controls) controls.dispose();
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = settings.enableDamping;
      controls.dampingFactor = 0.1;
      controls.addEventListener('change', requestRender);
      requestRender();
    }
    createRenderer();

    // --- Scene helpers (grid, axes, build plate) ---
    let grid = null;
    let axes = null;
    let buildPlate = null;

    function rebuildGrid() {
      if (grid) { scene.remove(grid); grid.geometry.dispose(); grid.material.dispose(); grid = null; }
      if (!settings.showGrid) { requestRender(); return; }
      const sx = settings.bedSizeX, sy = settings.bedSizeY;
      const size = Math.max(sx, sy);
      const divisions = Math.round(size / 10);
      grid = new THREE.GridHelper(size, divisions, 0x444444, 0x222222);
      grid.rotation.x = Math.PI / 2;
      grid.position.set(sx / 2, sy / 2, 0);
      scene.add(grid);
      requestRender();
    }
    function rebuildAxes() {
      if (axes) {
        scene.remove(axes);
        axes.geometry?.dispose?.();
        axes.material?.dispose?.();
        axes = null;
      }
      if (!settings.showAxes) { requestRender(); return; }
      axes = new THREE.AxesHelper(30);
      scene.add(axes);
      requestRender();
    }
    function rebuildBuildPlate() {
      if (buildPlate) { scene.remove(buildPlate); buildPlate.geometry.dispose(); buildPlate.material.dispose(); buildPlate = null; }
      if (!settings.showBuildPlate) { requestRender(); return; }
      const sx = settings.bedSizeX, sy = settings.bedSizeY;
      const geo = new THREE.PlaneGeometry(sx, sy);
      const mat = new THREE.MeshBasicMaterial({ color: 0x1a1a24, transparent: true, opacity: 0.6 });
      buildPlate = new THREE.Mesh(geo, mat);
      buildPlate.position.set(sx / 2, sy / 2, -0.01);
      scene.add(buildPlate);
      requestRender();
    }
    rebuildGrid();
    rebuildAxes();
    rebuildBuildPlate();

    // ---- Viewer state ----
    // Keeps parsed gcode / loaded STL cached so settings changes don't re-parse.
    const viewer = {
      previewObject: null,
      gcode: null,   // { segments, bounds, label, rawCount }
      stl: null,     // { geometry, label }
      lastBounds: null,
    };

    function disposeObject(obj) {
      if (!obj) return;
      scene.remove(obj);
      obj.geometry?.dispose?.();
      const m = obj.material;
      if (Array.isArray(m)) m.forEach(x => x.dispose());
      else m?.dispose?.();
    }

    function clearPreview() {
      disposeObject(viewer.previewObject);
      viewer.previewObject = null;
    }

    function frameBounds(minV, maxV) {
      viewer.lastBounds = { min: [...minV], max: [...maxV] };
      const cx = (minV[0] + maxV[0]) / 2;
      const cy = (minV[1] + maxV[1]) / 2;
      const cz = (minV[2] + maxV[2]) / 2;

      const sx = Math.max(maxV[0] - minV[0], 1);
      const sz = Math.max(maxV[2] - minV[2], 1);
      const fov = camera.fov * Math.PI / 180;
      const aspect = camera.aspect;
      const distV = (sz / 2) / Math.tan(fov / 2);
      const distH = (sx / 2) / (Math.tan(fov / 2) * aspect);
      const dist = Math.max(distV, distH, 50) * 1.25;

      const panX = sx * settings.panX;
      const panZ = sz * settings.panZ;
      controls.target.set(cx + panX, cy, cz + panZ);
      camera.position.set(cx + panX, cy - dist, cz + panZ);
      camera.lookAt(cx + panX, cy, cz + panZ);
      requestRender();
    }

    function reframe() {
      if (viewer.lastBounds) frameBounds(viewer.lastBounds.min, viewer.lastBounds.max);
    }

    function parseGcodeText(text) {
      const segments = [];
      let x = 0, y = 0, z = 0, ePrev = 0;
      let abs = true;
      const min = [Infinity, Infinity, Infinity];
      const max = [-Infinity, -Infinity, -Infinity];

      const lines = text.split('\n');
      for (let i = 0; i < lines.length; i++) {
        let line = lines[i];
        const semi = line.indexOf(';');
        if (semi >= 0) line = line.slice(0, semi);
        line = line.trim();
        if (!line) continue;
        const parts = line.split(/\s+/);
        const cmd = parts[0].toUpperCase();

        if (cmd === 'G90') { abs = true; continue; }
        if (cmd === 'G91') { abs = false; continue; }
        if (cmd === 'G92') {
          for (let j = 1; j < parts.length; j++) {
            if (parts[j][0].toUpperCase() === 'E') {
              const v = parseFloat(parts[j].slice(1));
              if (!isNaN(v)) ePrev = v;
            }
          }
          continue;
        }
        if (cmd !== 'G0' && cmd !== 'G1') continue;

        let nx = x, ny = y, nz = z, ne = ePrev;
        for (let j = 1; j < parts.length; j++) {
          const axis = parts[j][0].toUpperCase();
          const v = parseFloat(parts[j].slice(1));
          if (isNaN(v)) continue;
          if (axis === 'X') nx = abs ? v : x + v;
          else if (axis === 'Y') ny = abs ? v : y + v;
          else if (axis === 'Z') nz = abs ? v : z + v;
          else if (axis === 'E') ne = abs ? v : ePrev + v;
        }

        const extruding = ne > ePrev + 1e-6;
        if (extruding && (nx !== x || ny !== y || nz !== z)) {
          segments.push([x, y, z, nx, ny, nz]);
          for (let k = 0; k < 3; k++) {
            const v = [nx, ny, nz][k];
            if (v < min[k]) min[k] = v;
            if (v > max[k]) max[k] = v;
          }
        }
        x = nx; y = ny; z = nz; ePrev = ne;
      }

      if (!segments.length) {
        min[0] = min[1] = min[2] = 0;
        max[0] = max[1] = max[2] = 0;
      }
      return { segments, bounds: { min, max } };
    }

    const X_AXIS = new THREE.Vector3(1, 0, 0);
    const _dir = new THREE.Vector3();
    const _dummy = new THREE.Object3D();

    function segColor(outColor, zNorm) {
      if (settings.colorScheme === 'solid') {
        outColor.set(settings.solidColor);
      } else {
        outColor.setHSL(0.62 - zNorm * 0.55, 0.7, 0.55);
      }
    }

    // Grote performance-win: slicers produceren veel tiny collineaire segmenten
    // die we kunnen samenvoegen, en micro-extrusies (<0.02mm) droppen.
    const MIN_SEG_LEN = 0.02;
    const MERGE_DOT = 0.9995;   // ~1.8° afwijking tolerantie
    const MERGE_GAP = 1e-3;

    function optimizeSegments(segments) {
      const out = [];
      if (!segments.length) return out;
      let cur = null;
      for (let i = 0; i < segments.length; i++) {
        const s = segments[i];
        const dx = s[3] - s[0], dy = s[4] - s[1], dz = s[5] - s[2];
        const len = Math.sqrt(dx * dx + dy * dy + dz * dz);
        if (len < MIN_SEG_LEN) continue;
        if (cur) {
          const cdx = cur[3] - cur[0], cdy = cur[4] - cur[1], cdz = cur[5] - cur[2];
          const clen = Math.sqrt(cdx * cdx + cdy * cdy + cdz * cdz);
          const gapX = s[0] - cur[3], gapY = s[1] - cur[4], gapZ = s[2] - cur[5];
          const gap = Math.sqrt(gapX * gapX + gapY * gapY + gapZ * gapZ);
          if (gap < MERGE_GAP && clen > 0) {
            const dot = (cdx * dx + cdy * dy + cdz * dz) / (clen * len);
            if (dot > MERGE_DOT) {
              cur[3] = s[3]; cur[4] = s[4]; cur[5] = s[5];
              continue;
            }
          }
          out.push(cur);
        }
        cur = [s[0], s[1], s[2], s[3], s[4], s[5]];
      }
      if (cur) out.push(cur);
      return out;
    }

    // Build flat positions/colors once. Reused by Low + Medium renderers.
    function buildSegmentBuffers(segments, bounds) {
      const zMin = bounds.min[2];
      const zRange = Math.max(bounds.max[2] - zMin, 1e-6);
      const n = segments.length;
      const positions = new Float32Array(n * 6);
      const colors = new Float32Array(n * 6);
      const c = new THREE.Color();
      for (let i = 0; i < n; i++) {
        const s = segments[i];
        positions.set(s, i * 6);
        segColor(c, (s[2] - zMin) / zRange);
        const o = i * 6;
        colors[o]     = c.r; colors[o + 1] = c.g; colors[o + 2] = c.b;
        colors[o + 3] = c.r; colors[o + 4] = c.g; colors[o + 5] = c.b;
      }
      return { positions, colors };
    }

    function setLineBounds(geo, bounds) {
      const { min, max } = bounds;
      geo.boundingBox = new THREE.Box3(
        new THREE.Vector3(min[0], min[1], min[2]),
        new THREE.Vector3(max[0], max[1], max[2]),
      );
      geo.boundingSphere = new THREE.Sphere();
      geo.boundingBox.getBoundingSphere(geo.boundingSphere);
    }

    // LOW: plain 1px lines met vertex-colors. Goedkoopste pipeline in Three.js:
    // geen geometry shader, geen LineMaterial. Ideaal voor zeer grote files.
    function buildGcodeLow(segments, bounds) {
      const { positions, colors } = buildSegmentBuffers(segments, bounds);
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      geo.computeBoundingBox();
      geo.computeBoundingSphere();
      const mat = new THREE.LineBasicMaterial({ vertexColors: true });
      return new THREE.LineSegments(geo, mat);
    }

    // MEDIUM: thick lines (Line2). Screen-space of world-units afhankelijk van settings.
    function buildGcodeMedium(segments, bounds) {
      const { positions, colors } = buildSegmentBuffers(segments, bounds);
      const geo = new LineSegmentsGeometry();
      geo.setPositions(positions);
      geo.setColors(colors);
      setLineBounds(geo, bounds);
      const mat = new LineMaterial({
        vertexColors: true,
        linewidth: settings.mediumWorldUnits ? settings.extrusionWidth : settings.mediumLinewidth,
        worldUnits: settings.mediumWorldUnits,
        dashed: false,
      });
      mat.resolution.set(wrap.clientWidth, wrap.clientHeight);
      const obj = new LineSegments2(geo, mat);
      obj.userData.lineMaterial = mat;
      return obj;
    }

    // HIGH: solid extrusion boxes per segment via InstancedMesh.
    function buildGcodeHigh(segments, bounds) {
      const n = segments.length;
      const box = new THREE.BoxGeometry(1, settings.extrusionWidth, settings.layerHeight);
      const mat = new THREE.MeshLambertMaterial();
      const mesh = new THREE.InstancedMesh(box, mat, n);
      mesh.instanceMatrix.setUsage(THREE.StaticDrawUsage);

      const zMin = bounds.min[2];
      const zRange = Math.max(bounds.max[2] - zMin, 1e-6);
      const color = new THREE.Color();

      let written = 0;
      for (let i = 0; i < n; i++) {
        const s = segments[i];
        const dx = s[3] - s[0], dy = s[4] - s[1], dz = s[5] - s[2];
        const len = Math.sqrt(dx * dx + dy * dy + dz * dz);
        if (len < 1e-5) continue;

        _dir.set(dx / len, dy / len, dz / len);
        _dummy.position.set((s[0] + s[3]) / 2, (s[1] + s[4]) / 2, (s[2] + s[5]) / 2);
        _dummy.quaternion.setFromUnitVectors(X_AXIS, _dir);
        _dummy.scale.set(len, 1, 1);
        _dummy.updateMatrix();
        mesh.setMatrixAt(written, _dummy.matrix);

        segColor(color, (s[2] - zMin) / zRange);
        mesh.setColorAt(written, color);
        written++;
      }
      mesh.count = written;
      mesh.instanceMatrix.needsUpdate = true;
      if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
      // Frustum culling op mesh-niveau via echte bounds uit de gcode:
      mesh.boundingBox = new THREE.Box3(
        new THREE.Vector3(bounds.min[0], bounds.min[1], bounds.min[2]),
        new THREE.Vector3(bounds.max[0], bounds.max[1], bounds.max[2]),
      );
      mesh.boundingSphere = new THREE.Sphere();
      mesh.boundingBox.getBoundingSphere(mesh.boundingSphere);
      return mesh;
    }

    function buildGcodeForQuality(segments, bounds) {
      switch (settings.quality) {
        case 'low':  return buildGcodeLow(segments, bounds);
        case 'high': return buildGcodeHigh(segments, bounds);
        default:     return buildGcodeMedium(segments, bounds);
      }
    }

    function applyFrustum(obj) {
      if (obj) obj.frustumCulled = settings.frustumCulling;
    }

    function renderCurrent() {
      clearPreview();
      if (viewer.gcode) {
        const { segments, bounds, label, rawCount } = viewer.gcode;
        if (!segments.length) {
          $('info').textContent = `${label} — geen extrusion segments`;
          requestRender();
          return;
        }
        viewer.previewObject = buildGcodeForQuality(segments, bounds);
        applyFrustum(viewer.previewObject);
        scene.add(viewer.previewObject);
        frameBounds(bounds.min, bounds.max);
        const mergedInfo = rawCount && rawCount !== segments.length
          ? ` (${rawCount} raw → ${segments.length} na merge)`
          : '';
        $('info').textContent = `${label} — ${segments.length} segments${mergedInfo} · ${settings.quality}`;
      } else if (viewer.stl) {
        const { geometry, label } = viewer.stl;
        geometry.computeVertexNormals();
        geometry.computeBoundingBox();
        const bb = geometry.boundingBox;
        const stlColor = settings.colorScheme === 'solid' ? settings.solidColor : 0x4a9eff;
        const mat = new THREE.MeshPhongMaterial({
          color: stlColor,
          specular: 0x222222,
          shininess: settings.quality === 'low' ? 10 : 40,
          flatShading: settings.quality === 'low',
        });
        viewer.previewObject = new THREE.Mesh(geometry, mat);
        applyFrustum(viewer.previewObject);
        scene.add(viewer.previewObject);
        frameBounds([bb.min.x, bb.min.y, bb.min.z], [bb.max.x, bb.max.y, bb.max.z]);
        const tri = geometry.attributes.position.count / 3;
        $('info').textContent = `${label} — STL, ${tri | 0} triangles · ${settings.quality}`;
      } else {
        $('info').textContent = 'geen bestand geladen';
      }
      requestRender();
    }

    function showGcodeSegments(segments, bounds, label) {
      const rawCount = segments.length;
      const optimized = optimizeSegments(segments);
      viewer.gcode = {
        segments: optimized,
        bounds,
        label,
        rawCount,
      };
      viewer.stl = null;
      renderCurrent();
    }

    function showStlGeometry(geometry, label) {
      viewer.stl = { geometry, label };
      viewer.gcode = null;
      renderCurrent();
    }

    const hemi = new THREE.HemisphereLight(0xddeeff, 0x202030, settings.ambientIntensity);
    scene.add(hemi);
    const dirLight = new THREE.DirectionalLight(0xffffff, settings.dirIntensity);
    dirLight.position.set(200, 200, 400);
    scene.add(dirLight);
    const fillLight = new THREE.DirectionalLight(0x88aaff, settings.fillIntensity);
    fillLight.position.set(-200, -100, 200);
    scene.add(fillLight);

    // FPS monitor: toont alleen real render-fps, niet idle frames.
    const fpsEl = $('fps');
    let fpsFrames = 0;
    let fpsLast = performance.now();

    function animate() {
      requestAnimationFrame(animate);
      if (controls.update()) needsRender = true;
      if (needsRender) {
        renderer.render(scene, camera);
        needsRender = false;
        fpsFrames++;
        const now = performance.now();
        const dt = now - fpsLast;
        if (dt >= 500) {
          fpsEl.textContent = `${Math.round((fpsFrames * 1000) / dt)} fps`;
          fpsFrames = 0;
          fpsLast = now;
        }
      } else if (performance.now() - fpsLast > 1500) {
        fpsEl.textContent = 'idle';
        fpsLast = performance.now();
        fpsFrames = 0;
      }
    }
    animate();

    function handleResize() {
      camera.aspect = wrap.clientWidth / wrap.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(wrap.clientWidth, wrap.clientHeight);
      const lm = viewer.previewObject?.userData?.lineMaterial;
      if (lm) lm.resolution.set(wrap.clientWidth, wrap.clientHeight);
      requestRender();
    }
    window.addEventListener('resize', handleResize);

    async function loadGcode() {
      $('info').textContent = 'gcode laden…';
      try {
        const r = await fetch('/api/gcode');
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const data = await r.json();

        if (!data.segments || data.segments.length === 0) {
          clearPreview();
          $('info').textContent = data.filename
            ? `${data.filename} — geen extrusion segments`
            : 'geen bestand geselecteerd in OctoPrint';
          return;
        }
        showGcodeSegments(data.segments, data.bounds, data.filename || 'gcode');
      } catch (e) {
        $('info').textContent = `fout: ${e.message}`;
      }
    }

    async function previewLocalFile(file) {
      $('info').textContent = `${file.name} — preview laden…`;
      const name = file.name.toLowerCase();
      try {
        if (name.endsWith('.stl')) {
          const buf = await file.arrayBuffer();
          const loader = new STLLoader();
          const geo = loader.parse(buf);
          showStlGeometry(geo, file.name);
        } else {
          const text = await file.text();
          const { segments, bounds } = parseGcodeText(text);
          showGcodeSegments(segments, bounds, file.name);
        }
      } catch (e) {
        $('info').textContent = `preview fout: ${e.message}`;
      }
    }

    async function updateStatus() {
      try {
        const r = await fetch('/api/status');
        const data = await r.json();
        $('status').textContent = data.connected ? '● verbonden' : '○ offline';
        $('status').style.color = data.connected ? '#22aa55' : '#888';
      } catch {
        $('status').textContent = '○ offline';
      }
    }

    $('btn-reload').addEventListener('click', loadGcode);

    // --- Upload handling ---
    let selectedFile = null;

    $('file-input').addEventListener('change', e => {
      selectedFile = e.target.files[0];
      if (selectedFile) {
        $('file-name').textContent = selectedFile.name + ` (${(selectedFile.size / 1024).toFixed(1)} KB)`;
        $('btn-upload').disabled = false;
        $('upload-msg').textContent = '';

        if (selectedFile.name.toLowerCase().endsWith('.stl')) {
          $('upload-msg').innerHTML = '<span style="color: #e0a030;">⚠ STL vereist slicing plugin in OctoPrint. Slice lokaal voor beste resultaat.</span>';
        }

        previewLocalFile(selectedFile);
      }
    });

    $('btn-upload').addEventListener('click', async () => {
      if (!selectedFile) return;

      const autoPrint = $('auto-print').checked;

      if (autoPrint) {
        const ready = await fetch('/api/printer-ready').then(r => r.json());
        if (!ready.ready) {
          $('upload-msg').innerHTML = `<span style="color: #d04040;">✗ Kan niet direct printen: ${ready.reason}</span>`;
          return;
        }
        if (!confirm(`Direct printen zonder preview?\n\nBestand: ${selectedFile.name}\n\nWeet je zeker dat:\n- Het bed schoon is\n- Juiste filament is geladen\n- Printer is geleveld`)) {
          return;
        }
      }

      const fd = new FormData();
      fd.append('file', selectedFile);
      fd.append('auto_print', autoPrint);
      fd.append('auto_select', 'true');

      $('btn-upload').disabled = true;
      $('upload-msg').innerHTML = '<span style="color: #888;">Uploaden…</span>';

      try {
        const r = await fetch('/api/upload', { method: 'POST', body: fd });
        const data = await r.json();

        if (!r.ok) {
          $('upload-msg').innerHTML = `<span style="color: #d04040;">✗ ${data.detail}</span>`;
        } else {
          $('upload-msg').innerHTML = `<span style="color: #22aa55;">✓ ${data.filename} geüpload${data.printing ? ' — print gestart' : ''}</span>`;
          $('print-controls').style.display = 'flex';

          setTimeout(() => loadGcode(), 2000);
        }
      } catch (e) {
        $('upload-msg').innerHTML = `<span style="color: #d04040;">✗ ${e.message}</span>`;
      } finally {
        $('btn-upload').disabled = false;
      }
    });

    $('btn-start').addEventListener('click', async () => {
      const ready = await fetch('/api/printer-ready').then(r => r.json());
      if (!ready.ready) {
        alert('Kan niet starten: ' + ready.reason);
        return;
      }
      if (!confirm('Print starten?')) return;

      const r = await fetch('/api/print/start', { method: 'POST' });
      if (!r.ok) alert('Start mislukt: ' + await r.text());
    });

    $('btn-pause').addEventListener('click', async () => {
      await fetch('/api/print/pause', { method: 'POST' });
    });

    $('btn-cancel').addEventListener('click', async () => {
      if (!confirm('Print annuleren? Dit kan niet ongedaan gemaakt worden.')) return;
      await fetch('/api/print/cancel', { method: 'POST' });
    });

    // --- Drag and drop ---
    const uploadZone = $('upload-zone');
    ['dragover', 'dragenter'].forEach(evt => {
      uploadZone.addEventListener(evt, e => {
        e.preventDefault();
        uploadZone.style.background = '#1a2030';
      });
    });
    ['dragleave', 'drop'].forEach(evt => {
      uploadZone.addEventListener(evt, e => {
        e.preventDefault();
        uploadZone.style.background = '#14141c';
      });
    });
    uploadZone.addEventListener('drop', e => {
      if (e.dataTransfer.files.length > 0) {
        $('file-input').files = e.dataTransfer.files;
        $('file-input').dispatchEvent(new Event('change'));
      }
    });

    // --- Settings panel wiring ---
    const panelEl = $('settings-panel');
    $('btn-settings').addEventListener('click', () => panelEl.classList.toggle('open'));
    $('btn-close-settings').addEventListener('click', () => panelEl.classList.remove('open'));

    // Welke settings vereisen welke actie bij wijziging
    const REBUILD = new Set([
      'quality', 'mediumLinewidth', 'mediumWorldUnits',
      'extrusionWidth', 'layerHeight', 'colorScheme', 'solidColor',
    ]);
    const RECREATE_RENDERER = new Set(['antialias']);
    const REFRAME = new Set(['panX', 'panZ']);

    function applySetting(key) {
      switch (key) {
        case 'pixelRatio':
          renderer.setPixelRatio(settings.pixelRatio);
          handleResize();
          break;
        case 'fov':
          camera.fov = settings.fov;
          camera.updateProjectionMatrix();
          requestRender();
          break;
        case 'enableDamping':
          controls.enableDamping = settings.enableDamping;
          break;
        case 'frustumCulling':
          applyFrustum(viewer.previewObject);
          requestRender();
          break;
        case 'showGrid':      rebuildGrid(); break;
        case 'showAxes':      rebuildAxes(); break;
        case 'showBuildPlate': rebuildBuildPlate(); break;
        case 'bedSizeX':
        case 'bedSizeY':
          rebuildGrid();
          rebuildBuildPlate();
          break;
        case 'bgColor':
          scene.background = new THREE.Color(settings.bgColor);
          requestRender();
          break;
        case 'ambientIntensity': hemi.intensity = settings.ambientIntensity; requestRender(); break;
        case 'dirIntensity': dirLight.intensity = settings.dirIntensity; requestRender(); break;
        case 'fillIntensity': fillLight.intensity = settings.fillIntensity; requestRender(); break;
      }
      if (RECREATE_RENDERER.has(key)) {
        createRenderer();
        handleResize();
        renderCurrent();
      } else if (REBUILD.has(key)) {
        renderCurrent();
      } else if (REFRAME.has(key)) {
        reframe();
      }
    }

    function bindControl(el) {
      const key = el.dataset.setting;
      const initial = settings[key];
      const valEl = el.parentElement.querySelector('.val');

      if (el.type === 'checkbox') {
        el.checked = !!initial;
      } else if (el.type === 'range' || el.type === 'number') {
        el.value = initial;
        if (valEl) valEl.textContent = initial;
      } else {
        el.value = initial;
      }

      el.addEventListener('input', () => {
        let v;
        if (el.type === 'checkbox') v = el.checked;
        else if (el.type === 'range' || el.type === 'number') v = parseFloat(el.value);
        else v = el.value;
        settings[key] = v;
        if (valEl) valEl.textContent = (typeof v === 'number') ? (Number.isInteger(v) ? v : v.toFixed(2)) : v;
        saveSettings();
        applySetting(key);
      });
    }

    document.querySelectorAll('#settings-panel [data-setting]').forEach(bindControl);

    $('btn-reframe').addEventListener('click', reframe);
    $('btn-reset-settings').addEventListener('click', () => {
      if (!confirm('Alle settings resetten naar defaults?')) return;
      Object.assign(settings, DEFAULT_SETTINGS);
      saveSettings();
      document.querySelectorAll('#settings-panel [data-setting]').forEach(el => {
        const key = el.dataset.setting;
        const v = settings[key];
        const valEl = el.parentElement.querySelector('.val');
        if (el.type === 'checkbox') el.checked = !!v;
        else el.value = v;
        if (valEl) valEl.textContent = v;
      });
      createRenderer();
      rebuildGrid(); rebuildAxes(); rebuildBuildPlate();
      scene.background = new THREE.Color(settings.bgColor);
      camera.fov = settings.fov; camera.updateProjectionMatrix();
      hemi.intensity = settings.ambientIntensity;
      dirLight.intensity = settings.dirIntensity;
      fillLight.intensity = settings.fillIntensity;
      renderCurrent();
    });

    // --- Init ---
    updateStatus();
    loadGcode();
    setInterval(updateStatus, 5000);
  </script>
</body>
</html>
